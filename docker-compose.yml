services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dataa-web
    ports:
      - "8080:80"
    volumes:
      # Live-reload local files during development (comment out for production)
      - .:/var/www/html
      # Persist enquiry logs outside the container
      - dataa-storage:/var/www/html/storage
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
      - TZ=Asia/Kolkata
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dataa-storage:
